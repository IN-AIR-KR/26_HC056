# Used by gui.sh. Xwayland supplies X11 access on a Wayland desktop.
# Only the local display socket and a temporary session cookie are shared.
services:
  camera:
    environment:
      DISPLAY: ${DISPLAY:?Run gui.sh from the Pi desktop terminal}
      XAUTHORITY: /tmp/pi5-test.xauth
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      QT_AUTO_SCREEN_SCALE_FACTOR: "0"
      QT_SCALE_FACTOR: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${GUI_XAUTHORITY:?Use gui.sh}:/tmp/pi5-test.xauth:ro
    command: ["python3", "camera_test.py", "--source", "bridge", "--bridge", "/shared/latest.frame", "--preview", "--seconds", "30"]

  hailo:
    environment:
      DISPLAY: ${DISPLAY:?Run gui.sh from the Pi desktop terminal}
      XAUTHORITY: /tmp/pi5-test.xauth
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      QT_AUTO_SCREEN_SCALE_FACTOR: "0"
      QT_SCALE_FACTOR: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${GUI_XAUTHORITY:?Use gui.sh}:/tmp/pi5-test.xauth:ro
    command: ["python3", "hailo_test.py", "--hef", "/models/model.hef", "--source", "bridge", "--bridge", "/shared/latest.frame", "--preview", "--seconds", "30", "--metrics", "/outputs/hailo.json"]
