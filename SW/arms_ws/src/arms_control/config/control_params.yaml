# arms_control_node 파라미터 (SITL 기준값 = 코드 기본값).
#
# ★ 여기 값은 arms_control_node.cpp 의 declare_parameter 기본값과 같게 유지한다.
#   값을 바꿀 땐 반드시 둘 다 바꿔라.
#
# 실기체는 hw_overrides.yaml 이 이 위에 얹혀 델타만 덮어쓴다
# (control.launch.py / arms.launch.py). SITL 런치는 이 파일만 읽는다.

arms_control_node:
  ros__parameters:

    # =====================================================================
    # 미션 상태머신
    # =====================================================================
    mission:

      # ── 검출 → LOCK 판정 ──────────────────────────────────────────────
      # 카메라 재학습 모델의 validation F1 최적 confidence(0.32)에 맞춘 값.
      # 오검출은 아래 1초 연속 LOCK 판정과 detection 노드의 CV 시간 게이팅으로 억제한다.
      detection_confidence_threshold: 0.32
      detection_timeout_sec: 1.0
      lock_duration_sec: 1.0

      # ── TRACK → RTL 판정 (비전 looming, τ) ────────────────────────────
      # 거리센서 없이 bbox 팽창률로 충돌 임박을 판정한다. 3D 거리는 실기체에서
      # 못 쓰므로 sim 포함 전면 제거했고, 종말 RTL은 τ 로만 결정된다.
      #   τ = bbox크기 / 크기변화율 = 충돌까지 시간.
      #   스케일 불변이라 표적 크기·카메라와 무관 — 작은 x500도 큰 풍선도 같은 로직.
      #
      tau_rtl_sec: 0.3          # τ 이 값 미만 + 정렬 + 최소크기 → RTL. 늦으면 ↓, 빨리 끝나면 ↑
      intercept_align_tol: 0.2  # 종말 RTL 정렬 허용오차
      loom_s_min: 0.1           # 최소 bbox 크기(정규화). 원거리/노이즈 오탐 차단
      loom_size_alpha: 0.3      # bbox 크기 EMA (클수록 민첩/노이즈↑)
      loom_rate_alpha: 0.3      # 크기변화율(ṡ) EMA (τ 안정화)

      # ── 자동 발진 ─────────────────────────────────────────────────────
      # 락 되면 사람이 LAUNCH 를 누르지 않아도 auto_launch_delay_sec 뒤에 스스로
      # TRACK 으로 넘어간다. 표적이 '접근할 때' 요격하려는 것(꽁무니 추격 방지).
      #   SITL 전용. 실기체는 hw_overrides.yaml 이 false 로 덮어쓴다 — 한동안
      #   그 주석만 있고 실제 오버라이드가 없어서 실기체도 true 였다.
      sitl_auto_launch: true
      auto_launch_delay_sec: 0.5
      # ── 종말 RTL 소스 ───────────────────────────────────────────────
      # 서로 독립적인 두 스위치다. 이름의 sitl/실기체는 "누가 쓰나"의 관례일 뿐,
      # 둘 다 환경과 무관하게 동작한다(오해 방지로 sitl_hit_rtl 을 분리·개명).
      #   hit_rtl_via_referee : 심판 /arms/hit(Gazebo 접촉) 수신 시 RTL.
      #     → SITL 만 해당(실기체엔 /arms/hit 발행자 없음). 실기체는 hw_overrides 가 false.
      #   looming_rtl_enabled: 비전 τ(bbox 팽창률)로 충돌 임박 판정 → RTL.
      # 조합: SITL=(true,false) / 실기체 현재=(false,false) / 자동 종말=(false,true).
      hit_rtl_via_referee: true
      looming_rtl_enabled: false

    # =====================================================================
    # 발사 잠금장치 서보 (Jetson 하드웨어 PWM, sysfs)
    # =====================================================================
    #   enabled=true면 자동 SEARCH 진입에서 LOCK, LOCK→TRACK에서 OPEN.
    #   false면 상태와 무관하게 OPEN 위치를 유지한다.
    #   각도 방향은 lock_duty_ns/open_duty_ns 스왑으로 반전.
    servo:
      enabled: false
      chip_path: "/sys/class/pwm/pwmchip0"   # 핀15=GP88_PWM1=3280000.pwm=pwmchip0
      channel: 0
      period_ns: 20000000    # 50Hz = 20ms
      lock_duty_ns: 1500000  # 90°  = 1.5ms (LOCK 기본)
      open_duty_ns: 2500000  # 180° = 2.5ms (OPEN 기본)

    # =====================================================================
    # 배터리 잔량(%) 계산  — UI 좌측 하단 표시에 쓰인다.
    # =====================================================================
    # 셀 수는 전압으로 자동 감지한다(cells = ceil(V / 4.3), 연결 시점 전압으로 6S/4S 등 판별,
    #   첫 유효 전압에서 1회 감지 후 래치). 잔량은 감지된 셀 수로 선형 근사한다:
    #     pct = (전압 - cells·cell_empty_v) ÷ (cells·(cell_full_v - cell_empty_v)),  0~100% clamp
    battery:
      cell_full_v: 4.2     # 만충 시 셀당 전압[V]
      cell_empty_v: 3.5    # 방전(0%) 셀당 전압[V]

    # =====================================================================
    # 제어
    # =====================================================================
    # 신호 흐름 (자동요격은 PX4 ACRO 고정):
    #
    #   픽셀오차 ─→ [기본 추적 PID | PN | IBVS 공선유도] ─→ 각속도[deg/s]
    #            ─→ 근접도(크기) 게인 스케줄링
    #            ─→ clamp(max_cmd_rate_dps) ─→ ÷max_rate_dps ─→ FlightCommand
    #   (별도로) 정렬품질(center_q) × 근접도(크기) × τ(접근속도) ─→ 추력
    #
    control:

      # ── 루프 ──────────────────────────────────────────────────────────
      control_rate_hz: 50.0   # 제어 주파수. 높을수록 반응 빠르고 매끄러움(PN 정확도↑). 카메라 60Hz 와 짝

      # ── 유도 방식 ─────────────────────────────────────────────────────
      # 0 = 기본 추적 (픽셀오차 PID 추종). 리드는 lead_gain(시간기반)으로 준다.
      # 1 = PN 비례항법 (시선각속도를 없애도록 조종 → 미래 충돌점을 앞질러 겨냥).
      #     리드를 alpha-beta(pn_alpha/pn_beta)로 스스로 만든다 → lead_gain 은 안 쓴다.
      # 2 = IBVS 공선유도 (배리어 Lyapunov). ★현재 기본값★
      #     논문 arXiv:2404.08296 식 (12),(13) 을 우리 기하에 적용.
      #     추력축(기체 +Z)을 시선에 정렬한다 = 겨누기와 가기가 같은 동작이 된다.
      #     게인이 상수가 아니라 "화면 가장자리로 갈수록 발산"하는 배리어 함수라,
      #     중앙 근처는 부드럽고 가장자리는 필사적이다 → 표적을 FOV 밖으로 안 놓친다.
      # ★ 세 방식은 배타적이다. 아래 파라미터는 "mode N 전용"으로 나뉘며,
      #   현재 mode 와 무관한 쪽 값은 무시된다. 소속을 각 블록 머리에 표기했다.
      guidance_mode: 2

      # 중심 근처 게인 감쇠(gain_scale / pitch_scale) 스위치. false = 순수 P.
      #   켜면 느린 표적이 중심 근처일 때 게인을 0.5~0.75 배로 낮추고, roll 오차가
      #   크면 pitch 를 0.8~0.9 배로 누른다. 구 물리량 시절 지터 대책이라 현재
      #   기체에서는 재검증 전이다. deadzone 과 같이 "중심 근처에서 일부러 약해지는"
      #   장치라, 표적이 중앙에 안 붙는 증상을 만들 수 있다.
      gain_shaping: false

      # ── 기본 추적 PID [mode 0 전용] ───────────────────────────────────
      # 단위: 정규화 픽셀오차 → 각속도[deg/s].
      #   출력 한계는 아래 max_cmd_rate_dps 하나다 (per-PID output_limit 삭제).
      #   kp 를 올릴 때 포화 시작점이 같이 내려간다: |오차| = max_cmd_rate_dps/kp
      #   부터 P 항만으로 최대 출력이라, 그 위로는 kp 를 올려도 아무것도 안 바뀐다.
      # 튜닝 순서: kp 를 낮은 값에서 조금씩 ↑ (떨리면 30% ↓) → 그 다음 kd → lead.
      roll_pid:
        kp: 400.0
        ki: 0.0
        kd: 3.5
      pitch_pid:
        kp: 400.0
        ki: 0.0
        kd: 3.5

      roll_sign: 1.0
      pitch_sign: 1.0

      # 중력 처짐 보상용 수직 조준 오프셋 [mode 0 전용]. 정규화 영상 높이 단위.
      #   양수: 카메라 중심을 풍선보다 화면 위쪽으로 조준
      #         (= 풍선의 목표 위치는 화면 중심보다 아래, raw_err_y=이 값).
      #   0.03은 480px 영상에서 약 14px. 음수면 반대 방향, 0이면 기존 중앙 조준.
      mode0_aim_above_offset: 0.03

      # 예측 조준(lead) — [mode 0 전용]. 움직이는 표적의 미래 위치를 겨냥.
      #   PN(mode 1)은 리드를 alpha-beta 로 따로 만들므로 lead_gain 을 안 읽는다 → 0 유지.
      lead_gain: 0.0

      # 표적 속도추정(err_dot) — [mode 0 전용]. LOS 미분+LPF 로 표적 각속도를 추정한다.
      #   lead_gain(리드)과 gain_shaping 이 이 값을 공유한다(그래서 lead_ 접두사 아님).
      #   둘 다 꺼져 있으면(lead_gain=0, gain_shaping=false) 출력엔 영향 없고 로그 표시용.
      #   PN(mode 1)은 이 대신 pn_alpha/pn_beta 로 시선각속도를 추정한다.
      err_dot_alpha: 0.2      # 속도추정 LPF (클수록 예측 민첩/노이즈↑)
      err_dot_clamp: 0.6      # 속도추정 스파이크 제한

      # ── PN 비례항법 [mode 1 전용] ─────────────────────────────────────
      # ★ 아래 게인은 구 물리량(1.36kg·둔감) 기준 "3.6m/s 검증값"이다. 현재
      #   기체는 더 가볍고 응답이 빨라 SITL 재검증이 필요하다.
      #   빠른 표적 못 잡으면 pn_nav_gain ↑ / 떨리면 pn_nav_gain ↓ 또는 alpha·beta ↓
      #   과조향·발진이면 pn_nav_gain 과 kp 부터 낮춘다.
      pn_nav_gain: 250.0      # = 옛 50 x att_p 3.5. LOS각속도 → 각속도 명령
      pn_center_gain: 300.0  # = 옛 15 x att_p 3.5. err→0 정면조준. 정지표적은 ↑
                             #   (double 선언 파라미터 — 맨정수로 쓰면 노드가 기동 즉시 abort)
      pn_alpha: 0.35          # alpha-beta 위치이득 (표적 상태추정)
      pn_beta: 0.02           # alpha-beta 속도이득 (LOS각속도 추정). 낮추면 리드가 매끈해짐
      # LOS각속도 제한. 근거리 폭주(±2↑) 차단. 0=무제한.
      #   ★ mode 1(PN) 과 mode 2(IBVS) 가 공유한다 — 같은 신호를 쓰므로 한계도 하나다.
      pn_los_clamp: 1.5

      # ── IBVS 공선유도 [mode 2 전용] ───────────────────────────────────
      # 논문: Yang, Bai, She, Quan, "High-Speed Interception Multicopter Control
      #       by Image-based Visual Servoing", arXiv:2404.08296, 식 (12),(13).
      #
      # 우리 기체는 카메라 광축이 기체 +Z = 추력축이다(상방 카메라). 그래서
      # 논문의 설계 LOS n_td 가 곧 추력방향 n_f 이고, 공선오차를 풀면 자세 R_b^e
      # 가 양변에서 상쇄된다 → 자세/거리/속도/DKF 없이 픽셀만으로 계산된다.
      #
      #   x_n = 2*tan(hfov/2) * error_x          (tan 단위 이미지좌표)
      #   y_n = 2*tan(hfov/2) * aspect * error_y
      #   N   = sqrt(1 + x_n^2 + y_n^2)
      #   z1  = 1 - 1/N            = 1 - cos(theta)   theta = 광축 이탈각
      #   게인 = ibvs_gain * z1/(kb^2 - z1^2) + ibvs_center_gain
      #   roll  = 게인 * x_n/N  + ibvs_los_rate_gain * LOS각속도_x
      #   pitch = 게인 * y_n/N  + ibvs_los_rate_gain * LOS각속도_y
      #   yaw   = 0              ← 기하학적으로 저절로 0 (뺄 필요 없음)
      #
      # ★ 두 항의 역할이 다르다 (논문의 목표① / 목표② 에 각각 대응):
      #   배리어항      = 표적을 FOV 안에 붙잡는다 (겨누기). 논문 omega1.
      #   LOS각속도항   = 미래 충돌점을 앞질러 겨눈다 (리드). 논문 omega2 의 대역.
      #   배리어항만 쓰면 '표적의 현재 위치'만 겨냥하는 pure pursuit 이 되어,
      #   횡단하는 표적은 정렬이 아무리 좋아도 종말에 반드시 빗나간다.
      #
      # 현재 기본값에서의 응답(가로오차 기준, 근접 스케줄링 적용 전):
      #   err 0.05 → 4.5 deg/s  err 0.10 → 12   err 0.20 → 49
      #   err 0.30 → 137        err 0.40 → 325(포화)
      #   (참고: 기존 mode 0 PID kp=400 은 각각 20/40/80/120/160)
      #   화각이 43.6°로 좁아져 같은 픽셀오차가 작은 각도라 중앙 근처는 PID 보다
      #   훨씬 약하다. 0.3 밖부터 배리어가 급격히 커진다. ★ 협각 기준 재튜닝 전.
      #
      # 튜닝 순서: ibvs_los_rate_gain(리드) → ibvs_gain(세기) → ibvs_center_gain → kb

      # 카메라 화각/종횡비 — 픽셀오차를 각도로 바꾸는 데 필요.
      #   SITL 값은 arms_sim 기체 SDF 의 upward_camera 스펙과 일치시킨 것:
      #   <horizontal_fov>0.7610</horizontal_fov> rad = 43.6028 deg, 720x480
      #   (RunCam Phoenix 2 SE V2 + 8mm 렌즈).
      #   ★ 실기체는 hw_overrides.yaml 의 control.camera.* (체커보드 캘리)가 이 근사를 대체한다.
      #      틀리면 각도 환산이 통째로 어긋나 게인이 전부 어긋난다.
      ibvs_hfov_deg: 43.6028
      ibvs_aspect: 0.6666667   # 세로/가로 = 480/720

      # 배리어 한계 kb. z1 이 여기 닿으면 게인이 발산한다 = "못 넘어가는 벽".
      #   z1 = 1 - cos(theta) 환산:  kb 0.07→21°  0.11→27°  0.29→45°  0.55→63°
      #   위 화각(43.6°, 3:2)에서 화면 모서리(25.7°)의 z1 = 0.099 이므로 그보다 약간 크게 잡았다.
      #   ↓ 낮추면 표적을 더 중앙에 붙잡으려 함(공격적/과조향 위험)
      #   ↑ 올리면 가장자리까지 느긋하게 허용(놓칠 위험)
      #   ※ 노드 기동 로그에 "화면 모서리 z1=..." 을 찍으니 kb 와 비교해 볼 것.
      ibvs_kb: 0.11

      # 배리어항 계수[deg/s] — 유도 전체의 세기. 못 따라가면 ↑, 과조향/발진이면 ↓.
      ibvs_gain: 70.0

      # 선형항 계수[deg/s] — 중앙 근처 권한 보강.
      #   순수 배리어는 중앙 근처에서 theta^3 라 거의 0 이다(표적이 중앙 근처에서
      #   멈춰 버림). 논문은 그 구간을 자세루프 omega2 가 메우는데 우리는 아직
      #   omega1 만 쓰므로 여기서 보강한다.
      #   0 으로 두면 논문 그대로의 순수 배리어 거동을 볼 수 있다.
      ibvs_center_gain: 50.0

      # LOS각속도항 계수 — ★횡단 표적 요격의 핵심★
      #   alpha-beta 가 추정한 시선각속도에 곱한다. 한 항이 두 일을 한다:
      #     · 표적이 화면을 가로지를 때       → 예측 조준(리드). PN 과 같은 역할.
      #     · 내가 과조향해 오차가 빨리 줄 때 → 브레이크(감쇠). kd 와 같은 역할.
      #
      #   SITL 표적(referee)은 3.6m/s 로 화면을 대각선 횡단한다. 그때 LOS각속도는
      #   거리에 반비례해 치솟는다:  20m→10deg/s  10m→21  5m→41  3m→69.
      #   리드가 없으면 종말에 표적이 옆으로 빠지면서 구조적으로 빗나간다
      #   (게인을 아무리 올려도 안 된다 — pure pursuit 의 본질적 한계).
      #
      #   크기의 의미 —  이 값 / (kx * 57.3)  =  항법계수 N  =  명령각속도 / LOS각속도
      #     175 → N=1.0   시선과 '같은' 속도로 돈다 = 카메라만 따라붙고 리드 없음
      #     220 → N=1.2   약한 리드  ★기본값★
      #     350 → N=2.0   강한 리드. SITL 실측에서 심한 진동 유발 — 낮췄다.
      #
      #   ★★★ 진동 주의 ★★★  (SITL 실측: 350 에서 "카메라가 많이 흔들린다")
      #   이 항이 곱하는 losf_x_dot_(alpha-beta LOS각속도 추정)은
      #   error_lpf_alpha 로 걸러진 '순수 픽셀오차(los_x=filt_err_x_)'의 미분이다.
      #   자세 보정이 전혀 없다. 그런데 화면이 움직이는 이유는 둘이 섞여 있다:
      #     ① 표적이 실제로 움직여서   ② 내가 회전해서(카메라가 같이 돌아가므로)
      #   배리어항(z1)은 정적 정렬오차라 자세가 기하학적으로 상쇄되지만(위 설명),
      #   시간미분인 이 항은 그 상쇄가 안 된다. 그래서 게인이 크면:
      #     표적이 살짝 벗어남 → 돈다 → 회전 때문에 화면이 움직임
      #     → "리드항"이 이를 '표적이 빠르다'로 착각 → 더 세게 돈다 → 반복
      #   자기 회전을 쫓는 되먹임(양성 피드백)이 생겨 진동한다. 게인을 낮추면
      #   이 증폭이 줄어 완화되지만, 근본 원인(자기회전 미보정)은 남아있다.
      #   완전한 해결은 자이로 각속도로 자기회전분을 빼는 것(=논문의 R_b^e 보정과
      #   같은 역할)인데, 지금은 vehicle/attitude를 제어루프에 안 쓰므로 미구현이다.
      #
      #   근거리 클램프는 pn_los_clamp 를 mode 1 과 공유한다.
      #   흔들리면 ↓ (175 까지 — 그래도 흔들리면 pn_alpha/pn_beta 도 의심할 것)
      #   종말에 계속 뒤처지면(못 맞추면) ↑ (350 이상은 진동 확인됨, 신중히 올릴 것)
      ibvs_los_rate_gain: 15.0

      # ── 근접도 기반 게인/스로틀 스케줄링 ──────────────────────────────
      #   화면 속 표적 크기(bbox, loom_s_ema_)가 커질수록(=가까워질수록) 회전 게인과
      #   최대 추력을 같이 낮춘다. 원근 때문에 가까울수록 같은 실제 오차도 화면상
      #   커 보여 PID/PN이 과민반응(오버슈트)하기 쉽고, 접근 속도가 빠르면 그걸
      #   보정할 시간도 부족해진다 — 그래서 회전/추력을 같이 줄여야 의미가 있다.
      near_size_start: 0.15    # 이 bbox 크기부터 스케줄링 시작 (그 이하=원거리, 스케줄링 없음)
      near_size_full: 0.35     # 이 크기에서 min_gain_scale/min_throttle_scale 로 완전히 적용
      min_gain_scale: 0.4      # 최근접시 회전 게인 배율 하한 (1.0=스케줄링 무효)
      min_throttle_scale: 0.6  # 최근접시 추력 상한 배율 하한 (1.0=스케줄링 무효)

      # ── 출력 제한 (각속도) ────────────────────────────────────────────
      max_cmd_rate_dps: 227.5 # 유도가 낼 수 있는 최대 각속도.
      max_rate_dps: 400.0     # 풀스틱 각속도 = PX4 MC_ACRO_R/P_MAX (run_arms.sh 가 400 으로 설정)

      # ── 추력 ──────────────────────────────────────────────────────────
      # TRACK 추력은 hover_throttle ↔ track_throttle 보간이 전부다. 겨냥이 좋을수록
      # (오차 < pursuit_gate) track 쪽으로, 빗나가면 hover 쪽으로 붙는다.
      #   SITL 기체: AUW 1.05kg · 모터당 1.5kgf(총 6kgf) · TWR≈5.71.
      #   스로틀 u → 모터 ω = 150 + 850·u (PX4 SIM_GZ_EC_MIN/MAX) → 추력 ∝ ω².
      #     u=0.32 → 추력/무게 1.0(호버) · u=0.66 → 2.9 (예전 1kgf 모터의 0.85 와 같은 추력)
      #   ★ 실기체는 hw_overrides.yaml 이 hover/track 을 따로 덮어쓴다.
      hover_throttle: 0.32    # 빗나갔을 때 최소 추력(재조준). = 호버. MPC_THR_HOVER 와 일치
      track_throttle: 0.60    # 잘 겨눴을 때 최대 상승(표적쪽 돌진). 못 쫓으면 ↑ (최대 1.0 = 추력/무게 5.7)
      pursuit_gate: 0.25      # 오차 이 이하면 full 상승 (pursuit_center_boost=true 일 때만 의미)
      # 중앙 정렬될수록 추력 세지는 로직 on/off. false=정렬 무관 상수 추력(track_throttle 고정).
      pursuit_center_boost: false   # ★ 비활성화(요청). true 면 기존처럼 center_q 로 hover↔track 보간

      # ── τ(충돌까지 시간) 기반 추력 감속 ────────────────────────────────
      # 위 near_size 스케줄링은 "화면 속 크기"만 보고 "접근 속도"는 모른다 — 같은
      # 크기라도 천천히 다가오면 여유, 빠르게 다가오면 임박인데 구분을 못 한다.
      #
      # τ = bbox크기/팽창률 = 몇 초 뒤 충돌(mission.tau_rtl_sec 과 같은 신호,
      # update_looming() 에서 항상 계산됨). 스케일 불변이라 표적 실제 크기가
      # 없어도 된다(위 tau_rtl_sec 설명과 동일한 이유).
      #
      # 겨냥(guidance_mode 2, IBVS)이 좋아질수록 접근이 빨라지는데, 추력은 여전히
      # "정렬 품질"(center_q)만 보고 최대로 밀어붙인다 → 정렬이 완벽해도 관성 때문에
      # 표적을 살짝 지나칠 수 있다(SITL 실측: "아주 살짝 위로 가서 못 맞춤").
      # τ 가 작아질수록(=곧 충돌) 정렬 품질과 무관하게 추력을 hover 쪽으로 눌러서,
      # 지나치기 전에 속도를 줄이고 정밀 정렬에 시간을 벌어준다.
      #   tau_ease_start 보다 여유 있으면(τ 큼) 영향 없음 = 지금과 동일하게 동작.
      #   tau_ease_full 근처에서 tau_ease_min_scale 까지 눌린다.
      #   표적을 못 보거나 안 다가오는 중이면 τ=+inf → 자동으로 영향 없음(1.0).
      # ★ SITL 실측: 2.5 / 0.0 에서 정지 표적은 명중. 단, 이 값은 접근 추력을
      #   너무 일찍(2.5초=표적 9m 이동 분) 죽여서 움직이는 표적은 못 맞힘 —
      #   시간 기반 스칼라 감속의 구조적 한계로 보임(대화 기록 참고). 코드 수정은
      #   보류 중이며 이 값은 "정지 표적 명중" 상태를 저장하기 위한 스냅샷이다.
      tau_ease_start: 2.5      # 이 초 전부터 서서히 감속 시작[s]
      tau_ease_full: 0.3       # 이 초에서 최소 배율 적용[s] (tau_rtl_sec=0.3 과 맞춤)
      tau_ease_min_scale: 0.0  # τ 임박시 추력 배율 하한 (0=완전 hover, 1=끔=효과 없음)
      #   여전히 지나치면(관성이 안 잡히면) ↓ / 너무 일찍·세게 주저앉으면(못 따라붙으면) ↑
      #   또는 tau_ease_start 를 낮춰 감속 시작을 더 늦춘다.

      # ── 오차 필터 ─────────────────────────────────────────────────────
      error_lpf_alpha: 0.25
      deriv_lpf_alpha: 0.25
      # ★ deadzone 은 감산형이다: |오차|<dz 면 출력 0, 그 위는 dz 를 뺀 값.
      #   따라서 PID 의 평형점이 화면 중심이 아니라 |오차| = dz 가 된다.
      #   0.04 이던 시절 "표적이 중앙에 안 붙고 근처에서 멈추는" 증상의 직접 원인.
      #   순수 P 성능을 보려고 0 으로 뒀다. 중심에서 지터가 보이면 0.01~0.02 부터.
      deadzone: 0.0

      # ── 무장(arm) ─────────────────────────────────────────────────────
      # 자동 모드: 스위치와 분리하고 상태머신 상태로 컨트롤 노드가 결정한다.
      #   SEARCH/LOCK(throttle 0) 에서 미리 arm → TRACK 에서 throttle↑ 전에 무장
      #   완료 (PX4 의 high-throttle arm 거부 회피). SITL 전용.
      auto_arm_states: ["SEARCH", "LOCK", "TRACK", "RTL"]

      # 수동 모드: arm 하는 순간 스틱이 idle 이어야만 실제로 무장한다 (급상승/오발 방지).
      prearm_check: true
      prearm_throttle_max: -0.85   # throttle(axes[1]) 이 값 이하(최저)여야 arm 허용
      prearm_stick_tol: 0.15       # roll/pitch/yaw 중앙 허용오차
