# 실기체(Jetson) 전용 오버레이 — control_params.yaml 위에 얹힌다.
#
# 여기에는 SITL 기준값과 실제로 다른 값만 적는다. 누락한 값은
# control_params.yaml의 기준값을 사용한다.
#
# 로드 순서 (뒤가 이김):
#   control.launch.py / arms.launch.py: control_params.yaml → 이 파일
#   *_sitl.launch.py:                  control_params.yaml 만
#
# 카메라 캘리브레이션을 마치면 control.camera 아래에 calibrated, 이미지 크기,
# fx/fy/cx/cy, distortion_model, distortion만 추가한다. 캘리브레이션 전에는
# 기준 파일의 HFOV/aspect 근사를 그대로 사용한다.

/arms/arms_control_node:
  ros__parameters:

    # =====================================================================
    # 실기체 미션 정책
    # =====================================================================
    mission:
      # control은 detection 토픽에서 가장 높은 YOLO confidence를 다시 확인해 LOCK/TRACK에
      # 사용할 유효 검출을 결정한다. 실내 실기체에서는 기준값보다 낮춘다.
      detection_confidence_threshold: 0.25

      # 실기체에는 SITL 심판 접촉 토픽이 없으므로 이 종말 조건은 비활성화한다.
      # 비전 τ 기반 종말 동작은 기준 파일에서 별도로 활성화할 수 있다.
      hit_rtl_via_referee: false

    # =====================================================================
    # 실기체 PID — 비행 로그 기반으로 확정되면 근거를 함께 남긴다.
    # =====================================================================
    control:
      # 단위: tan 카메라 좌표 → ACRO 각속도[deg/s].
      # 튜닝: kp를 낮은 값부터 올리고, 진동 시 낮춘 뒤 kd를 조절한다.
      roll_pid:
        kp: 300.0
        kd: 0.0
      pitch_pid:
        kp: 300.0
        kd: 0.0

      # 실제 기체의 호버·추격 추력은 SITL 물리 모델과 달라 별도로 둔다.
      hover_throttle: 0.51
      track_throttle: 0.70

      # 자동 모드에서 FC arm을 유지할 상태. 실험 목적에 따라 여기서 빠르게 바꾼다.
      auto_arm_states: ["SEARCH", "LOCK", "TRACK", "RTL"]
