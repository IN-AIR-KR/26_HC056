services:
  arms_detection:
    build:
      # context = arms_ws/src/ so Dockerfile can COPY arms_msgs/ and arms_detection/
      context: ../..
      dockerfile: arms_detection/docker/Dockerfile.laptop
    image: arms/detection:laptop

    # network_mode: host — container shares the host network stack.
    # ipc: host — FastDDS shared memory transport가 호스트 프로세스와 같은
    #             IPC 네임스페이스를 쓰도록 강제. 없으면 topic list는 보여도
    #             실제 데이터 수신이 안 됨.
    network_mode: host
    ipc: host

    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # ROS_NAMESPACE 는 ROS 1 환경변수다 — rclpy 가 읽지 않는다. 아래 command 의
      # `-r __ns:=/$ROS_NAMESPACE` 로 명시 적용해야 노드가 /arms 에 뜬다.
      # 네임스페이스가 비면 (1) detection.yaml 의 `/arms/arms_detection_node:` 키와
      # 매칭되지 않아 파라미터가 전부 무시되고(기동 거부), (2) 상대 토픽명
      # (camera/image_raw, perception/detections)이 /arms 없이 루트에 붙는다.
      - ROS_NAMESPACE=${ROS_NAMESPACE:-arms}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      # Force UDP-only FastDDS transport. SHM transport fails between container
      # and host because FastDDS SHM requires FD passing via Unix socket, which
      # does not work across the container boundary even with ipc: host.
      - FASTRTPS_DEFAULT_PROFILES_FILE=/fastdds_udp.xml
      # 랩탑 이미지는 PyTorch 라 .pt 를 그대로 쓴다(.engine 은 Jetson 전용).
      - ARMS_MODEL=${ARMS_MODEL:-/models/balloon_nano_v9.pt}
      - ARMS_CONF=${ARMS_CONF:-0.32}
      - ARMS_IOU=${ARMS_IOU:-0.45}
      - ARMS_FULL_IMGSZ=${ARMS_FULL_IMGSZ:-512}
      - ARMS_ROI_IMGSZ=${ARMS_ROI_IMGSZ:-320}
      - ARMS_CLASSES=${ARMS_CLASSES:-balloon}
      # 영상 노드는 JPEG 압축 토픽도 함께 발행한다. 컨테이너 경계를 넘어 큰 raw
      # 프레임을 UDP로 받으면 조각 유실이 발생하기 쉬우므로 압축 입력을 기본 사용한다.
      - ARMS_INPUT_COMPRESSED=${ARMS_INPUT_COMPRESSED:-1}
      # 검출 파라미터 override 파일명. 비어있으면 기본(detection.yaml)만 로드.
      - ARMS_DET_CONFIG=${ARMS_DET_CONFIG:-}
    volumes:
      - ./models:/models:ro    # .pt 가중치 위치 (git-lfs — 없으면 git lfs pull)
      - ./fastdds_udp.xml:/fastdds_udp.xml:ro
      # 노드 소스를 바인드 마운트 → 코드 수정 시 이미지 재빌드 없이 컨테이너
      # 재시작(docker compose restart arms_detection)만으로 반영. Dockerfile 이
      # 같은 경로로 COPY 한 파일 위에 덮어씌운다. (의존성/Dockerfile 변경 때만 재빌드)
      - ../arms_detection/arms_detection_node.py:/ros_ws/arms_detection_node.py:ro
      # 검출 파라미터 config (--params-file 로 로드).
      - ../config:/params:ro
    # detection.yaml 을 --params-file 로 로드. override 는 ARMS_DET_CONFIG 로 위에 얹는다.
    command:
      - bash
      - -c
      - "source /opt/ros/humble/setup.bash && source /ros_ws/install/setup.bash && python3 /ros_ws/arms_detection_node.py --ros-args -r __ns:=/$$ROS_NAMESPACE --params-file /params/detection.yaml $${ARMS_DET_CONFIG:+--params-file /params/$$ARMS_DET_CONFIG}"
    # 모델 로드·cold-start 실패는 설정/환경 오류다. 재시작 루프가 UI health를
    # 잠깐 online으로 보이게 하지 않도록, 수정 후 명시적으로 다시 기동한다.
    restart: "no"
