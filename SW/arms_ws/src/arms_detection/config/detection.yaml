# A.R.M.S. 검출 노드 기본 파라미터 (arms_detection_node)  — 기본 config (= 실외)
# ===========================================================================
# 검출 노드의 ROS 파라미터 기본 config (= 기본 운용 환경 실외). docker compose 가
# --params-file 로 로드한다. 실내 등은 detection.indoor.yaml override 를 위에 얹는다:
#   ARMS_DET_CONFIG=detection.indoor.yaml docker compose ... up -d   (SETUP.md A-5 참고)
#
# 이 파일은 검출 파라미터의 유일한 기본 원천이다. 누락된 키는 노드가 기동을 거부한다.
#
# 모델 backend와 경로는 런치가 반드시 명시 주입한다. 누락 시 노드는 기동을 거부한다.
# HEF 고유 NMS 형식은 아래 config가 단일 원천이며, smoke test 출력으로 맞춘다.
/arms/arms_detection_node:
  ros__parameters:
    inference:
      confidence_threshold: 0.32
      iou_threshold: 0.45
      full_imgsz: 512
      roi_imgsz: 320
      hailo:
        # HEF가 요구하는 입력 색 순서. Hailo model zoo의 일반 YOLO HEF는 RGB다.
        input_color: rgb
        # HEF가 출력하는 NMS tensor 이름. HEF가 출력 하나만 가진 경우 빈 값으로 둔다.
        output_name: ""
        # Hailo NMS의 known layout. raw feature-map HEF는 지원하지 않는다.
        nms_format: classwise_yxyx_score
        class_names: [balloon]

    # =====================================================================
    # 검출 처리
    # =====================================================================
    proc_width: 320 # 검출 처리 가로 해상도[px], 0=원본 (출력은 비율이라 정확도 무관, CV 비용만 절감)
    use_hsv: true # HSV 후보 제안 on/off (off=순수 전체화면 YOLO)

    yolo:
      # HSV→ROI YOLO 가 아무것도 못 찾은 프레임에 전체 화면 YOLO 를 도는 주기.
      #   1=매 프레임, N=N프레임마다, 0 이하=끔. (부하↕ 를 여기서 조절)
      full_fallback_interval: 1
      proposal_crop_px: 192 # HSV 후보 검증용 crop 한 변[px]

    # =====================================================================
    # HSV 붉은색 후보 제안 (단독 LOCK 금지 — 최종 승인은 YOLO)
    #   실외(자연광) 기준: 채도·hue 가 뚜렷 → 색 게이트를 조여 하늘/구름/반사 오탐 억제.
    #   표적이 멀어 작게 잡힘 → 면적 하한을 낮게.
    # =====================================================================
    hsv:
      max_candidates: 2 # YOLO 로 검증할 상위 후보 수
      texture_shortlist: 10 # 질감 계산(비쌈) 적용할 상위 후보 수
      # 면적 게이트 (화면 대비 bbox 넓이 비율)
      min_area_ratio: 0.0004 # 이 미만=노이즈 컷 (먼 작은 표적은 살림). 상한 없음(근접 표적 유지)
      # 색 게이트 (자연광: 채도 중심↑ + 확률 임계↑)
      hue_sigma: 15.0 # 빨강 원형 Gaussian 폭(클수록 hue 관용)
      prob_threshold: 0.25 # 붉은색 확률 이진화 임계
      sat_center: 100.0 # 채도 sigmoid 중심(옅은 색 배제)
      sat_scale: 40.0 # 채도 sigmoid 완만도
      val_min: 40.0 # 명도 하한(어두운 픽셀 억제)
      val_max_center: 230.0 # 과포화(조명) 감점 중심
      val_scale: 40.0 # 명도 상한 sigmoid 완만도
      # 형상 게이트
      min_circularity: 0.30 # 원형도/종횡비 하한(클러터 많으면 더 올림)
      texture_scale: 120.0 # 매끈함 점수 스케일(작을수록 텍스처 배경 배제 강함)

    # =====================================================================
    # 표적 필터 (KF 평활 + 이상치 게이트)
    #   상태 전이:  NEW → TRACKED ⇄ LOST → REMOVED → (다음 검출) NEW
    # =====================================================================
    filter:
      confirm_frames: 3 # NEW→TRACKED: 같은 위치 연속검출 이만큼이면 표적 확정
      confirm_dist: 0.035 # NEW: "같은 위치" 연속 판정 중심거리(정규화)
      jump_gate: 0.4 # TRACKED 유지 게이트: 예측서 이 거리 넘게 튄 검출은 기각→miss (0=off)
      max_age: 8 # LOST→REMOVED: 연속 miss 이만큼이면 표적 제거
