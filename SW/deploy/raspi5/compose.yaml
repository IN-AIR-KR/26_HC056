x-arms-common: &arms-common
  build:
    context: ../..
    dockerfile: deploy/raspi5/Dockerfile
    args:
      BUILD_JOBS: ${BUILD_JOBS:-2}
  image: arms/raspi5-phase1:jammy-hailort-4.23.0
  platform: linux/arm64
  network_mode: host
  init: true
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  volumes:
    - ${CSI_SOCKET_DIR:-/run/arms-csi}:/run/arms-csi:ro
    - ${MODELS_DIR:-/opt/arms/models}:/models:ro

services:
  video:
    <<: *arms-common
    command:
      - bash
      - -lc
      - ros2 launch arms_video video_csi.launch.py csi_socket:=/run/arms-csi/camera.sock

  detection:
    <<: *arms-common
    devices:
      - ${HAILO_DEVICE:-/dev/hailo0}:/dev/hailo0
    command:
      - bash
      - -lc
      - >-
        ros2 run arms_detection arms_detection_node --ros-args
        -r __ns:=/arms
        --params-file /ros_ws/install/arms_detection/share/arms_detection/config/detection.yaml
        -p inference.backend:=hailo
        -p inference.model_path:=${HEF_MODEL:-/models/balloon.hef}
